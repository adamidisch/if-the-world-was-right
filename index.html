<div id="black"></div><button id="fs" aria-label="Fullscreen">⛶</button><div id="hint">σύρε αριστερά ή δεξιά</div></div>
<script>
const s=[...document.querySelectorAll('.slide')],b=document.getElementById('black'),h=document.getElementById('hint');let i=0,auto=true,t0=0;
function show(n){n=Math.max(0,Math.min(s.length-1,n));s.forEach((x,k)=>x.classList.toggle('show',k===n));i=n}
const wait=m=>new Promise(r=>setTimeout(r,m));async function cut(n){b.classList.add('on');await wait(500);show(n);b.classList.remove('on')}
async function run(){await wait(3000);if(!auto)return;await cut(1);await wait(3000);if(!auto)return;await cut(2);await wait(3000);if(!auto)return;s[2].style.transition='opacity 3s ease';show(3);await wait(3600);if(!auto)return;show(4);await wait(5000);if(!auto)return;show(5);await wait(5000);if(!auto)return;show(6);h.style.opacity=.7;await wait(2200);h.style.opacity=0}run();
function manual(n){auto=false;show(n)}addEventListener('touchstart',e=>t0=e.touches[0].clientX,{passive:true});addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-t0;if(Math.abs(d)>40)manual(i+(d<0?1:-1))},{passive:true});addEventListener('keydown',e=>{if(e.key==='ArrowRight')manual(i+1);if(e.key==='ArrowLeft')manual(i-1)});
document.getElementById('fs').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};
</script></body></html>
